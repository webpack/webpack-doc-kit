name: Create Blog Post

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.99.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.99.0)'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write

jobs:
  create-post:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      AUTHOR: ${{ github.actor }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create post
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/create-post.mjs "$TAG" --author="$AUTHOR"
          node --run format

      - name: Open pull request
        uses: gr2m/create-or-update-pull-request-action@b65137ca591da0b9f43bad7b24df13050ea45d1b # v1.10.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit-message: 'chore: blog post for webpack@${{ env.TAG }}'
          title: 'chore: blog post for webpack@${{ env.TAG }}'
          body: |
            Automated blog post by the `${{ env.TAG }}` webpack release.
          branch: 'chore/blog-${{ env.TAG }}'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          draft: true
