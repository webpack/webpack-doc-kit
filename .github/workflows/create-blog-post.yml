name: Create Blog Post

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.99.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.99.0)'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write

jobs:
  create-post:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      AUTHOR: ${{ github.actor }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create post
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/create-post.mjs "$TAG" --author="$AUTHOR"
          node --run format

      - name: Open pull request
        uses: gr2m/create-or-update-pull-request-action@b65137ca591da0b9f43bad7b24df13050ea45d1b # v1.10.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit-message: 'chore: blog post for webpack@${{ env.TAG }}'
          title: 'chore: blog post for webpack@${{ env.TAG }}'
          body: |
            Automated blog post by the `${{ env.TAG }}` webpack release.
          branch: 'chore/blog-${{ env.TAG }}'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          draft: true
