# Adapted from https://github.com/nodejs/nodejs.org/blob/main/.github/workflows/lighthouse.yml
name: Lighthouse

# Run after the preview is live instead of on pull_request.
on:
  deployment_status:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # for listPullRequestsAssociatedWithCommit below
  pull-requests: read

jobs:
  lighthouse:
    name: Lighthouse Report
    # successful preview deploys only, skip dependabot
    if: |
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Preview') &&
      startsWith(github.event.deployment.ref, 'dependabot/') == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve preview URL and PR number
        id: preview
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = context.payload.deployment_status.environment_url;

            // drop trailing slash before appending paths
            core.setOutput('url', url.replace(/\/+$/, ''));

            // map the deployed commit to its PR (works for forks). best-effort,
            // don't fail the audit if it doesn't resolve.
            const sha = context.payload.deployment.sha;
            try {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: sha,
                });

              const pr = prs.find(p => p.state === 'open') ?? prs[0];
              if (pr) {
                core.setOutput('pr_number', String(pr.number));
              } else {
                core.info(`No pull request found for ${sha}`);
              }
            } catch (error) {
              core.warning(`Could not resolve PR for ${sha}: ${error.message}`);
            }

      - name: Audit preview URLs with Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          # One page per render path.
          urls: |
            ${{ steps.preview.outputs.url }}/
            ${{ steps.preview.outputs.url }}/about
            ${{ steps.preview.outputs.url }}/about/sponsors
            ${{ steps.preview.outputs.url }}/blog
            ${{ steps.preview.outputs.url }}/blog/posts/2026-02-04-roadmap-2026
            ${{ steps.preview.outputs.url }}/guides/getting-started
            ${{ steps.preview.outputs.url }}/docs/api/options
            ${{ steps.preview.outputs.url }}/docs/loaders/css-loader

      - name: Format Lighthouse report
        id: format
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LIGHTHOUSE_RESULT: ${{ steps.lighthouse.outputs.manifest }}
          LIGHTHOUSE_LINKS: ${{ steps.lighthouse.outputs.links }}
          VERCEL_PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const { formatLighthouseResults } = await import(
              '${{ github.workspace }}/scripts/lighthouse/index.mjs'
            );
            await formatLighthouseResults({ core });

      - name: Prepare PR comment
        env:
          COMMENT: ${{ steps.format.outputs.comment }}
          PR_NUMBER: ${{ steps.preview.outputs.pr_number }}
        run: |
          set -euo pipefail
          mkdir -p pr-comment
          printf '%s' "$COMMENT" > pr-comment/comment.md
          printf '%s' "$PR_NUMBER" > pr-comment/pr-number.txt

      - name: Upload PR comment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-comment
          path: pr-comment/
          retention-days: 1
