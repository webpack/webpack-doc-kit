# Adapted from https://github.com/nodejs/nodejs.org/blob/main/.github/workflows/leave-comment.yml
name: Leave Comment

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Lighthouse]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  leave-comment:
    name: Leave Comment
    # only successful audits produce an artifact to post
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download Comment Artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-comment
          path: pr-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Pull Request Number
        id: pr
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // PR number written by the lighthouse job (works for forks)
            const numberFile = 'pr-comment/pr-number.txt';
            if (fs.existsSync(numberFile)) {
              const number = fs.readFileSync(numberFile, 'utf8').trim();
              if (number) {
                core.setOutput('number', number);
                return;
              }
            }

            const run = context.payload.workflow_run;

            if (run.pull_requests && run.pull_requests.length) {
              core.setOutput('number', run.pull_requests[0].number);
              return;
            }

            const match = await github.rest.pulls
              .list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                sort: 'updated',
                direction: 'desc',
                per_page: 1,
              })
              .then(r => r.data[0]);

            if (!match) {
              core.info(`No open pull request found for HEAD ${run.head_sha}`);
              return;
            }

            core.setOutput('number', match.number);

      - name: Add Comment to PR
        if: steps.download.outcome == 'success' && steps.pr.outputs.number != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          file-path: pr-comment/comment.md
          comment-tag: lighthouse_audit
          pr-number: ${{ steps.pr.outputs.number }}
